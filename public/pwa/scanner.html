<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Control de Asistencia - Escáner</title>
  <meta name="theme-color" content="#1e40af" />
  <link rel="manifest" href="/pwa/manifest.json" />
  <link rel="stylesheet" href="/pwa/scanner.css" />
  <style>
    :root { --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px); }
    html, body { overscroll-behavior: none; }
    body { padding-bottom: calc(24px + var(--safe-bottom)); }
    .scanner-header { top: calc(12px + var(--safe-top)); }
    .toast-container { padding-bottom: calc(24px + var(--safe-bottom)); }
  </style>
</head>
<body>
  <div class="scanner-app">
    <header class="scanner-header">
      <div class="logo">
        <span class="icon">📱</span>
        <span>Control de Asistencia</span>
      </div>
      <div class="connection-status" id="status-indicator">
        <span class="dot" id="dot"></span>
        <span id="status-text">Conectando...</span>
      </div>
    </header>

    <main class="scanner-main">
      <div class="camera-container">
        <video id="preview" playsinline autoplay muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="overlay">
          <div class="scan-frame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="toggle-camera" class="btn-secondary">Cambiar cámara</button>
        <button id="flash-toggle" class="btn-secondary">Flash</button>
      </div>

      <div class="last-scan" id="last-scan">
        <div class="scan-placeholder">Escanea un código QR de trabajador</div>
      </div>
    </main>

    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" type="text/javascript"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" type="text/javascript"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" type="text/javascript"></script>
  <script src="/pwa/scanner.js" type="module"></script>
</body>
</html>
